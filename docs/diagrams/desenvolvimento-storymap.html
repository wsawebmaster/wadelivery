<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabin Lanches — estado do desenvolvimento · Story map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #1e293b;
      --color-muted:   #475569;
      --color-accent:  #ffb020;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Sora', 'Instrument Serif', sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1140px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Story map · Estado do desenvolvimento</p>
    <h1>Fabin Lanches — desenvolvimento até aqui</h1>

    <svg viewBox="0 0 1240 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="desenvolvimento-storymap-title desenvolvimento-storymap-desc">

        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(30,41,59,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- Release slice bands (alternating ink @ 0.02 / none) -->

      <rect x="32" y="424" width="1176" height="80" fill="rgba(30,41,59,0.02)"/>

      <text x="48" y="468" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PLATAFORMA</text>

      <!-- Column separators: tie each card row to its activity column -->

      <line x1="564" y1="108" x2="564" y2="504" stroke="rgba(15,23,42,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <line x1="788" y1="108" x2="788" y2="504" stroke="rgba(15,23,42,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>

      <text x="452" y="88" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ACTIVITY 2</text>

      <rect x="576" y="40" width="200" height="64" rx="6" fill="rgba(30,41,59,0.05)" stroke="#475569" stroke-width="1"/>

      <text x="676" y="88" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ACTIVITY 3</text>

      <rect x="800" y="40" width="200" height="64" rx="6" fill="rgba(30,41,59,0.05)" stroke="#475569" stroke-width="1"/>

      <text x="380" y="266" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">delivery · pickup · Pix</text>

      <text x="604" y="250" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Pedidos em tempo real</text>

      <text x="1052" y="266" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">status · timing</text>

      <text x="1052" y="474" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">backup · sync · stats</text>
