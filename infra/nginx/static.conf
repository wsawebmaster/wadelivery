server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Desenvolvimento local: evita cache agressivo de JS/CSS
    location ~* \.(js|css|html|json|webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
